{{- if .Values.rbac.create -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "ceph-reports.fullname" . }}-read
  labels:
    {{- include "ceph-reports.labels" . | nindent 4 }}
  {{- with (include "ceph-reports.annotations" .) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "ceph-reports.fullname" . }}-read
subjects:
  - kind: ServiceAccount
    name: {{ include "ceph-reports.serviceAccountName" . }}
    namespace: {{ include "ceph-reports.namespace" . }}
{{- end }}
