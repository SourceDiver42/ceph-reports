{{- if .Values.mail.clusterNameFrom.enabled -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "ceph-reports.fullname" . }}-clustername
  namespace: {{ .Values.mail.clusterNameFrom.configMap.namespace }}
  labels:
    {{- include "ceph-reports.labels" . | nindent 4 }}
  {{- with (include "ceph-reports.annotations" .) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get"]
    {{- with .Values.mail.clusterNameFrom.configMap.name }}
    resourceNames: [{{ . | quote }}]
    {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "ceph-reports.fullname" . }}-clustername
  namespace: {{ .Values.mail.clusterNameFrom.configMap.namespace }}
  labels:
    {{- include "ceph-reports.labels" . | nindent 4 }}
  {{- with (include "ceph-reports.annotations" .) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "ceph-reports.fullname" . }}-clustername
subjects:
  - kind: ServiceAccount
    name: {{ include "ceph-reports.serviceAccountName" . }}
    namespace: {{ include "ceph-reports.namespace" . }}
{{- end }}
